name: Hanen 360 CI
on:
  push:
    paths: ['hanen-360/**', '.github/workflows/hanen-360-ci.yml']
  pull_request:
    paths: ['hanen-360/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: hanen-360 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: hanen-360/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:e2e
