<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=block"><style>
:root{--bg:#f7f6f2;--fg:#17181c;--tag:#e8361f;--muted:#55585f;--line:#e2e0da;--t1:#fde9e5;--t2:#e5f0f8;--t3:#eef5e4;--t4:#f6eddc;
--display:"Archivo Black","Arial Black",system-ui,sans-serif;--body:"IBM Plex Sans","IBM Plex Sans Arabic",Arial,sans-serif;--ar:"IBM Plex Sans Arabic",Tahoma,sans-serif;--mono:"IBM Plex Mono",Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body)}
.fr{position:absolute;inset:0;padding:80px 88px 80px;display:flex;flex-direction:column;gap:34px}
.hd{display:flex;justify-content:space-between;align-items:center;flex:none}
.logo{font-family:var(--display);font-size:60px;line-height:1;display:flex;align-items:center;gap:18px;letter-spacing:-.01em}
.logo i{font:600 40px/1 var(--mono);font-style:normal;background:var(--tag);color:#fff;padding:8px 14px;border-radius:8px}
.hd .ar{font:700 56px/1 var(--ar);direction:rtl}
.card{flex:1 1 0;min-height:0;border-radius:44px;position:relative;display:flex;align-items:center;justify-content:center;padding:40px}
.card>svg{width:100%;height:100%}
.tag{position:absolute;right:36px;bottom:30px;transform:rotate(-4deg);background:var(--tag);color:#fff;padding:24px 40px 22px 76px;
  clip-path:polygon(34px 0,100% 0,100% 100%,34px 100%,0 50%);display:flex;flex-direction:column;align-items:flex-start}
.tag::before{content:"";position:absolute;left:38px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--bg)}
.tag b{font-family:var(--display);font-weight:400;font-size:116px;line-height:1}
.tag span{font:600 40px/1.15 var(--mono);letter-spacing:.04em}
.txt{flex:none;display:flex;flex-direction:column;gap:14px}
.lbl{font:600 40px/1 var(--mono);letter-spacing:.08em;color:var(--tag);text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;font-size:92px;line-height:1.02;margin:0;letter-spacing:-.015em;text-wrap:balance}
.fr p{margin:0}
.fr .fx{font-size:44px;line-height:1.28;color:var(--muted);font-weight:500}
.arl{font:600 54px/1.5 var(--ar);direction:rtl;text-align:right}
.ft{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:28px;border-top:6px solid var(--fg);padding-top:28px}
.ft div{display:flex;gap:18px;align-items:center;font:600 40px/1.12 var(--body)}
.ft svg{width:64px;height:64px;flex:none}
/* pack */
.top{flex:none;display:flex;gap:30px;align-items:center}
.top .txt{flex:1}
.top .ill{width:300px;height:300px;flex:none;border-radius:40px;padding:26px}
.top .ill svg{width:100%;height:100%}
ol{margin:0;padding:22px 40px;list-style:none;background:#fff;border:5px solid var(--fg);border-radius:30px;counter-reset:n;flex:none}
ol li{counter-increment:n;font:500 44px/1.2 var(--body);padding:13px 0;display:flex;gap:24px;align-items:baseline;border-bottom:3px dashed var(--line)}
ol li:last-child{border-bottom:0}
ol li::before{content:counter(n);font:600 40px/1 var(--mono);color:var(--tag);width:30px;flex:none}
.prow{flex:none;display:flex;align-items:center;justify-content:space-between;gap:30px}
.prow .arl{flex:1}
.prow .tag{position:relative;right:auto;bottom:auto;flex:none}
.prow .tag b{font-size:96px}
.sp{flex:1 1 0}

" fill="#e8361f"/><circle cx="118" cy="245" r="40" fill="#e8361f"/></g><g fill="none" stroke="#17181c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"><path d="M120 40 H230 V215 L318 262 Q350 280 335 312 Q318 342 282 326 L150 262 Q120 247 120 212 Z"/></g><g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M140 50v30M162 50v30M184 50v30M206 50v30"/></g></g></svg><div class="tag"><span>PRIX UNIQUE</span><b>9,900</b><span>DT · <span lang="ar" style="font-family:var(--ar);letter-spacing:0">كل شي</span></span></div></div><div class="txt"><div class="lbl">Hiver</div><h1>Chaussettes thermiques (lot)</h1><p class="fx">Polaires et épaisses, pieds au chaud.</p><p class="arl" lang="ar" dir="rtl">الكارلاج بارد؟ ساقيك يبقاو سخونين</p></div><div class="ft"><div><svg viewBox="0 0 64 64"><rect x="4" y="16" width="56" height="32" rx="6" fill="#eef5e4" stroke="#17181c" stroke-width="5"/><circle cx="32" cy="32" r="8" fill="none" stroke="#17181c" stroke-width="4"/></svg><span>Paiement<br>à la livraison</span></div><div><svg viewBox="0 0 64 64"><rect x="3" y="16" width="36" height="28" rx="4" fill="#e8361f" stroke="#17181c" stroke-width="5"/><path d="M39 24h12l9 10v10H39z" fill="#fff" stroke="#17181c" stroke-width="5" stroke-linejoin="round"/><circle cx="16" cy="48" r="7" fill="#17181c"/><circle cx="48" cy="48" r="7" fill="#17181c"/></svg><span>Livraison gratuite<br>dès 5 articles</span></div></div></div></body></html>
